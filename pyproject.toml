[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "arcmira"
dynamic = ["version"]
description = "The Arcmira Python SDK for YouTube and podcast transcripts."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Arcmira", email = "zeal@arcmira.com" }]
requires-python = ">=3.9"
dependencies = ["httpx>=0.21.2,<1", "pydantic>=1.9.2,<3", "typing_extensions>=4.0.0"]
keywords = [
  "arcmira",
  "ai",
  "podcast monitoring",
  "transcript",
  "youtube monitoring",
  "mcp",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet",
]

[project.urls]
Homepage = "https://arcmira.com"
Documentation = "https://arcmira.com/docs"
Repository = "https://github.com/arcmira/python"
Issues = "https://github.com/arcmira/python/issues"

[tool.hatch.version]
path = "src/arcmira/_package.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/README.md",
  "/LICENSE",
  "/llms.txt",
]
exclude = [
  "/.gitignore",
  "/.github",
  "**/* [0-9].py",
]

[tool.hatch.build.targets.wheel]
packages = ["src/arcmira"]
exclude = ["**/* [0-9].py"]
