[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "arcmira"
version = "0.2.0"
description = "Arcmira SDK for Python. Search the spoken web, read transcripts, track mentions, sponsors and recommendations."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Arcmira", email = "hi@arcmira.com" }]
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.21.2",
  "pydantic>=1.9.2",
  "pydantic-core>=2.18.2,<3.0.0",
  "typing_extensions>=4.0.0",
]
keywords = [
  "arcmira",
  "sdk",
  "ai",
  "podcast monitoring",
  "transcript",
  "youtube monitoring",
  "mcp",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Typing :: Typed",
  "Topic :: Internet",
]

[project.urls]
Homepage = "https://arcmira.com"
Documentation = "https://arcmira.com/docs"
"API Reference" = "https://arcmira.com/docs/api-reference"
Repository = "https://github.com/arcmira/python"
Issues = "https://github.com/arcmira/python/issues"
"MCP server" = "https://github.com/arcmira/mcp"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "mypy==2.3.1",
]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/README.md",
  "/LICENSE",
  "/llms.txt",
  "/reference.md",
]
exclude = [
  "/.gitignore",
  "/.github",
]

[tool.hatch.build.targets.wheel]
packages = ["src/arcmira"]
