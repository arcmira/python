name: CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: bash scripts/check-commit-identity.sh
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - run: uv run python -m unittest discover -s tests -v
      - run: uv build
